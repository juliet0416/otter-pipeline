name: LeWork Desktop Build
run-name: LeWork v${{ inputs.version }} @ ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact HEAD SHA of OtterMind/ottermind customer-standalone-deploy
        required: true
        type: string
      version:
        description: LeWork desktop version (major.minor.patch)
        required: true
        type: string

permissions:
  contents: read
  actions: read

# This workflow never touches Ottermind's electron/releases/latest. The CDN
# publication job uses a separate LeWork prefix only after every signed build
# succeeds.
concurrency:
  group: lework-desktop-${{ inputs.source_sha }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  LEWORK_SOURCE_SHA: ${{ inputs.source_sha }}
  LEWORK_VERSION: ${{ inputs.version }}
  VITE_APP_CHANNEL: lework
  VITE_STUDIO_RENDER_MODE: remote

jobs:
  build-mac:
    name: Build and sign macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout standalone source branch
        uses: actions/checkout@v4
        with:
          repository: OtterMind/ottermind
          ref: customer-standalone-deploy
          path: source
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          persist-credentials: false
      - name: Verify source SHA, LeWork config, and set version
        working-directory: source
        run: bash ../scripts/lework-prepare.sh
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.6'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop dependencies
        working-directory: source
        run: bash ../scripts/lework-install.sh
      - name: Prepare x64 Electron for Rosetta bytecode
        if: matrix.arch == 'x64'
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/desktop/package.json').devDependencies.electron.replace(/^[^0-9]*/, '')")"
          dist=''
          for candidate in node_modules/electron/dist apps/desktop/node_modules/electron/dist; do
            if [ -d "$candidate" ]; then dist="$candidate"; break; fi
          done
          test -n "$dist"
          curl -fSL -o "$RUNNER_TEMP/electron-x64.zip" "https://github.com/electron/electron/releases/download/v${version}/electron-v${version}-darwin-x64.zip"
          rm -rf "$dist"
          mkdir -p "$dist"
          unzip -q "$RUNNER_TEMP/electron-x64.zip" -d "$dist"
          test -f "$dist/Electron.app/Contents/MacOS/Electron"
          if ! /usr/bin/pgrep -q oahd; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          file "$dist/Electron.app/Contents/MacOS/Electron"
      - name: Use GitHub Electron mirror
        working-directory: source
        run: |
          node -e "const fs=require('fs'); const p='apps/desktop/electron-builder.yml'; const s=fs.readFileSync(p,'utf8'); const a='mirror: https://npmmirror.com/mirrors/electron/'; if(!s.includes(a)) throw Error('mirror not found'); fs.writeFileSync(p,s.replace(a,'mirror: https://github.com/electron/electron/releases/download/'));"
      - name: Import Developer ID certificate
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/lework-signing.keychain"
          keychain_password="$(openssl rand -base64 24)"
          p12="$RUNNER_TEMP/mac-certs.p12"
          printf '%s' "$MAC_CERTS" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$MAC_CERTS_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$p12"
          security find-identity -v -p codesigning "$keychain" | grep -q 'Developer ID Application'
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build LeWork DMG and ZIP
        working-directory: source/apps/desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARIZE: 'true'
          NODE_OPTIONS: --max-old-space-size=6144
          VITE_APP_VERSION: ${{ inputs.version }}
        run: node scripts/build.mjs --mac --arch ${{ matrix.arch }}
      - name: Verify app identity and signature
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          app="$(find apps/desktop/dist -maxdepth 2 -name 'LeWork.app' -type d | head -n 1)"
          test -n "$app"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$app/Contents/Info.plist")" = 'com.insmtx.lework'
          schemes="$(plutil -extract CFBundleURLTypes json -o - "$app/Contents/Info.plist")"
          printf '%s' "$schemes" | grep -Fq '"lework"'
          if printf '%s' "$schemes" | grep -Fq '"ottermind"'; then
            echo 'LeWork app must not register the Ottermind protocol' >&2
            exit 1
          fi
          codesign --verify --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" > "$RUNNER_TEMP/codesign.txt" 2>&1
          grep -q 'Authority=Developer ID Application' "$RUNNER_TEMP/codesign.txt"
          grep -q 'flags=.*runtime' "$RUNNER_TEMP/codesign.txt"
          update_config="$app/Contents/Resources/app-update.yml"
          test -f "$update_config"
          grep -Fq 'https://lework.insmtx.com/desktop/releases/latest' "$update_config"
          if grep -Fq 'cdn.ottermind.ai/electron/releases/latest' "$update_config"; then
            echo 'Ottermind update feed leaked into LeWork app' >&2
            exit 1
          fi
          test -f "apps/desktop/dist/lework-${LEWORK_VERSION}-${{ matrix.arch }}.dmg"
      - name: Save signed Mac installers
        uses: actions/upload-artifact@v4
        with:
          name: lework-macos-${{ matrix.arch }}-${{ inputs.version }}
          path: |
            source/apps/desktop/dist/*.dmg
            source/apps/desktop/dist/*.zip
            source/apps/desktop/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows x64 (unsigned)
    runs-on: windows-latest
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout standalone source branch
        uses: actions/checkout@v4
        with:
          repository: OtterMind/ottermind
          ref: customer-standalone-deploy
          path: source
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          persist-credentials: false
      - name: Verify source SHA, LeWork config, and set version
        working-directory: source
        shell: bash
        run: bash ../scripts/lework-prepare.sh
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.6'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop dependencies
        working-directory: source
        shell: bash
        run: bash ../scripts/lework-install.sh
      - name: Build LeWork installer
        working-directory: source/apps/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          VITE_APP_VERSION: ${{ inputs.version }}
        run: node scripts/build.mjs --win --arch x64
      - name: Verify installer identity
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test -f "apps/desktop/dist/lework-${LEWORK_VERSION}-setup.exe"
          test -f apps/desktop/dist/latest.yml
          if grep -Fq 'cdn.ottermind.ai/electron/releases/latest' apps/desktop/dist/latest.yml; then
            echo 'Ottermind update feed leaked into LeWork installer metadata' >&2
            exit 1
          fi
      - name: Save unsigned installer for hardware signing
        uses: actions/upload-artifact@v4
        with:
          name: lework-windows-unsigned-${{ inputs.version }}
          path: source/apps/desktop/dist/lework-*-setup.exe
          if-no-files-found: error
          retention-days: 3

  sign-windows:
    name: Sign Windows x64
    needs: build-windows
    runs-on: [self-hosted, codesign]
    timeout-minutes: 180
    steps:
      - name: Download unsigned LeWork installer
        uses: actions/download-artifact@v4
        with:
          name: lework-windows-unsigned-${{ inputs.version }}
          path: ${{ runner.temp }}/lework-unsigned-${{ github.run_id }}
      - name: Sign with existing hardware token
        shell: bash
        run: |
          set -euo pipefail
          command -v sign.sh
          exe="$(find "$RUNNER_TEMP/lework-unsigned-${GITHUB_RUN_ID}" -maxdepth 1 -type f -name 'lework-*-setup.exe' | head -n 1)"
          test -n "$exe"
          sign.sh "$exe"
          test -s "$exe"
      - name: Save signed Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: lework-windows-signed-${{ inputs.version }}
          path: ${{ runner.temp }}/lework-unsigned-${{ github.run_id }}/lework-*-setup.exe
          if-no-files-found: error
          retention-days: 7

  publish-cdn:
    name: Publish LeWork CDN release
    needs: [build-mac, sign-windows]
    uses: ./.github/workflows/lework-cdn-publish.yml
    with:
      run_id: ${{ github.run_id }}
      version: ${{ inputs.version }}
      source_sha: ${{ inputs.source_sha }}
    secrets: inherit
