name: Huixin Test macOS Build
run-name: Huixin Mac v${{ inputs.version }} @ ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full SHA of the enterprise commit deployed to Huixin test
        required: true
        type: string
      version:
        description: Huixin test installer version (major.minor.patch)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: huixin-test-macos-${{ inputs.version }}
  cancel-in-progress: false

env:
  SOURCE_REPO: OtterMind/ottermind
  HUIXIN_SOURCE_SHA: ${{ inputs.source_sha }}
  HUIXIN_VERSION: ${{ inputs.version }}
  VITE_APP_CHANNEL: huixin-test

jobs:
  build-mac:
    name: Build and notarize Apple Silicon installer
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out pipeline scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify requested enterprise commit
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HUIXIN_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HUIXIN_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(gh api "repos/$SOURCE_REPO" --jq .visibility)" = private
          status="$(gh api "repos/$SOURCE_REPO/compare/$HUIXIN_SOURCE_SHA...enterprise" --jq .status)"
          if [[ "$status" != identical && "$status" != ahead ]]; then
            echo "::error::The requested commit is not reachable from enterprise."
            exit 1
          fi

      - name: Check out pinned desktop source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: source
          persist-credentials: false

      - name: Verify source and Huixin environment
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HUIXIN_SOURCE_SHA"
          test "$(uname -m)" = arm64
          if [[ ! -f apps/desktop/electron-builder-huixin-test.yml ]]; then
            echo "::error::This commit is missing the Huixin desktop packaging configuration."
            exit 1
          fi
          profile=apps/desktop/.env.huixin-test
          grep -Fxq 'VITE_APP_CHANNEL=huixin-test' "$profile"
          grep -Fxq 'VITE_APP_URL=https://test.ottermind.cn' "$profile"
          grep -Fxq 'VITE_API_URL=https://test.ottermind.cn' "$profile"
          grep -Fxq 'VITE_APP_ID=com.ottermind.huixin.test' "$profile"
          grep -Fxq 'VITE_DESKTOP_SCHEME=ottermind-huixin-test' .env.test

      - name: Check signing configuration
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          HUIXIN_MAC_HOST_PROFILE: ${{ secrets.HUIXIN_MAC_HOST_PROFILE }}
          HUIXIN_MAC_EXTENSION_PROFILE: ${{ secrets.HUIXIN_MAC_EXTENSION_PROFILE }}
        shell: bash
        run: |
          set -euo pipefail
          for key in MAC_CERTS APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID HUIXIN_MAC_HOST_PROFILE HUIXIN_MAC_EXTENSION_PROFILE; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing GitHub Actions secret $key"
              exit 1
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.6'

      - name: Install locked dependencies and prepare desktop tools
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun --cwd packages/types run build
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const electron = path.dirname(require.resolve('electron/package.json', { paths: [path.resolve('apps/desktop')] }));
          const binary = path.join(electron, 'dist', 'Electron.app', 'Contents', 'MacOS', 'Electron');
          if (!fs.existsSync(binary)) {
            execFileSync(process.execPath, [path.join(electron, 'install.js')], { stdio: 'inherit' });
          }
          fs.accessSync(binary, fs.constants.X_OK);
          const pkgPath = 'apps/desktop/package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = process.env.HUIXIN_VERSION;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Install distribution certificate and Huixin profiles
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          HUIXIN_MAC_HOST_PROFILE: ${{ secrets.HUIXIN_MAC_HOST_PROFILE }}
          HUIXIN_MAC_EXTENSION_PROFILE: ${{ secrets.HUIXIN_MAC_EXTENSION_PROFILE }}
        run: bash scripts/install-huixin-mac-signing.sh

      - name: Build signed Mac installer with File Provider
        working-directory: source/apps/desktop
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          OTTERMIND_BUILD_FILE_PROVIDER: '1'
          NOTARIZE: 'false'
          VITE_APP_VERSION: ${{ inputs.version }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/build.mjs --mac --arch arm64

      - name: Verify app and extension inside installer
        working-directory: source
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash ../scripts/verify-huixin-mac-installer.sh

      - name: Notarize and staple disk image
        working-directory: source
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          installer="apps/desktop/dist/huixin_test_ottermind-${HUIXIN_VERSION}-arm64.dmg"
          xcrun notarytool submit "$installer" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait --timeout 20m
          xcrun stapler staple "$installer"
          xcrun stapler validate "$installer"

      - name: Save installer to private draft release
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$SOURCE_REPO" --jq .visibility)" = private
          installer="apps/desktop/dist/huixin_test_ottermind-${HUIXIN_VERSION}-arm64.dmg"
          digest="$(shasum -a 256 "$installer" | awk '{print $1}')"
          tag="huixin-test-mac-v${HUIXIN_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          notes="$(printf 'Source commit `%s`\n\nInstaller SHA-256 `%s`\n' "$HUIXIN_SOURCE_SHA" "$digest")"
          url="$(gh release create "$tag" "$installer" --repo "$SOURCE_REPO" \
            --draft --prerelease --latest=false --target "$HUIXIN_SOURCE_SHA" \
            --title "Huixin Mac Test ${HUIXIN_VERSION}" --notes "$notes")"
          printf 'Installer available in the [private draft release](%s).\n' "$url" >> "$GITHUB_STEP_SUMMARY"
